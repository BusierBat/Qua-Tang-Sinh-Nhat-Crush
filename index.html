<!DOCTYPE html>
<html lang="vi" data-perf="balanced">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Một món quà sinh nhật nhỏ, được chuẩn bị bằng nhiều sự chỉn chu.">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#F6EBDD">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Có một món quà nhỏ dành cho bạn">
  <meta property="og:description" content="Được chuẩn bị bằng nhiều sự chỉn chu. Mở ra nhé?">
  <meta property="og:image" content="assets/images/apple-touch-icon.png">
  <title>Một món quà nhỏ</title>
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
  <link rel="apple-touch-icon" href="assets/images/apple-touch-icon.png">
  <link rel="preload" as="font" type="font/woff2" href="assets/fonts/PlayfairDisplay-700-vietnamese.woff2" crossorigin>
  <link rel="preload" as="font" type="font/woff2" href="assets/fonts/DancingScript-600-vietnamese.woff2" crossorigin>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- THANH TIỆN ÍCH (âm thanh + hiệu năng) -->
  <header class="top-bar" aria-label="Tùy chọn trải nghiệm">
    <button id="btn-sound" class="icon-btn" type="button" aria-pressed="true">
      <svg class="icon icon-on" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path d="M4 9.5v5h3.2L12 18.6V5.4L7.2 9.5H4Z" fill="currentColor"/>
        <path d="M15.4 8.6a4.6 4.6 0 0 1 0 6.8M17.9 6.3a8 8 0 0 1 0 11.4" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
      </svg>
      <svg class="icon icon-off" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path d="M4 9.5v5h3.2L12 18.6V5.4L7.2 9.5H4Z" fill="currentColor"/>
        <path d="M15.5 9.5l5 5M20.5 9.5l-5 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      </svg>
    </button>
    <button id="btn-perf" class="icon-btn" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="perf-panel">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path d="M4 7h9M17 7h3M4 12h3M11 12h9M4 17h11M19 17h1" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        <circle cx="15" cy="7" r="2.1" fill="var(--icon-knob, #fff)" stroke="currentColor" stroke-width="1.8"/>
        <circle cx="9" cy="12" r="2.1" fill="var(--icon-knob, #fff)" stroke="currentColor" stroke-width="1.8"/>
        <circle cx="17" cy="17" r="2.1" fill="var(--icon-knob, #fff)" stroke="currentColor" stroke-width="1.8"/>
      </svg>
    </button>
  </header>

  <!-- BẢNG CÀI HIỆU NĂNG -->
  <div id="perf-panel" class="perf-panel" role="dialog" aria-label="Cài đặt hiệu năng" hidden>
    <h2 class="perf-title" data-cfg="ui.perfTitle"></h2>
    <p class="perf-hint" data-cfg="ui.perfHint"></p>
    <fieldset class="perf-options">
      <legend class="visually-hidden">Chọn mức hiệu năng</legend>
      <label class="perf-opt"><input type="radio" name="perf-mode" value="auto"><span data-cfg="ui.perfAuto"></span></label>
      <label class="perf-opt"><input type="radio" name="perf-mode" value="efficient"><span data-cfg="ui.perfEfficient"></span></label>
      <label class="perf-opt"><input type="radio" name="perf-mode" value="balanced"><span data-cfg="ui.perfBalanced"></span></label>
      <label class="perf-opt"><input type="radio" name="perf-mode" value="high"><span data-cfg="ui.perfHigh"></span></label>
    </fieldset>
    <p class="perf-status" id="perf-status" role="status"></p>
  </div>

  <main id="main">

    <!-- 1. MÀN HÌNH ĐẦU: HỘP QUÀ 3D -->
    <section id="screen-landing" class="screen screen-landing is-active" data-screen="landing">
      <div class="landing-inner">
        <header class="landing-copy">
          <p class="landing-kicker" data-cfg="landing.kicker"></p>
          <h1 id="greeting" class="landing-greeting" tabindex="-1" data-cfg="landing.greeting"></h1>
          <p class="landing-sub" data-cfg="landing.sub"></p>
          <p class="landing-chip" id="landing-chip" hidden></p>
        </header>

        <div class="gift-stage" aria-hidden="true">
          <div class="gift-rays"></div>
          <div class="gift-halo"></div>
          <div class="gift-shadow"></div>
          <div class="gift-scene">
            <div class="gift-rig">
              <div class="gift-shaker">
                <div class="gift-bob">

                  <div class="gift-box">
                    <div class="face f-front"><span class="strip strip-v"></span><span class="strip strip-h"></span></div>
                    <div class="face f-back"><span class="strip strip-v"></span><span class="strip strip-h"></span></div>
                    <div class="face f-left"><span class="strip strip-v"></span><span class="strip strip-h"></span></div>
                    <div class="face f-right"><span class="strip strip-v"></span><span class="strip strip-h"></span></div>
                    <div class="face f-bottom"></div>
                    <div class="face f-inback"></div>
                    <div class="face f-inbottom"></div>
                    <span class="tissue tissue-a"></span>
                    <span class="tissue tissue-b"></span>
                    <div class="inner-glow"></div>
                    <span class="gift-card-peek" aria-hidden="true">
                      <svg viewBox="0 0 24 24" focusable="false"><path d="M12 20.6s-6.2-4-8.6-7.5C1.7 10.5 2.8 7.2 5.8 6.8c1.8-.25 3.3.65 4.2 2 .9-1.35 2.4-2.25 4.2-2 3 .44 4.1 3.7 2.4 6.3C14.2 16.6 12 20.6 12 20.6Z" fill="currentColor"/></svg>
                    </span>
                  </div>

                  <div class="gift-lid">
                    <div class="face l-front"><span class="strip strip-v"></span></div>
                    <div class="face l-back"><span class="strip strip-v"></span></div>
                    <div class="face l-left"><span class="strip strip-h"></span></div>
                    <div class="face l-right"><span class="strip strip-h"></span></div>
                    <div class="face l-top">
                      <span class="strip strip-v"></span><span class="strip strip-h"></span>
                      <span class="bow">
                        <span class="bow-loop loop-l"></span>
                        <span class="bow-loop loop-r"></span>
                        <span class="bow-knot"></span>
                        <span class="bow-tail tail-l"></span>
                        <span class="bow-tail tail-r"></span>
                      </span>
                    </div>
                  </div>

                </div>
              </div>
            </div>
          </div>
        </div>

        <div class="landing-actions">
          <button id="btn-open-gift" class="btn btn-primary btn-lg" data-cfg="landing.openButton"></button>
        </div>
      </div>
    </section>

    <!-- 3. THIỆP SINH NHẬT -->
    <section id="screen-card" class="screen screen-card" data-screen="card">
      <article class="card">
        <svg class="card-sprig sprig-tl" viewBox="0 0 60 60" aria-hidden="true" focusable="false">
          <path d="M6 54C10 34 22 18 44 8" fill="none" pathLength="1" stroke="#A8C5AE" stroke-width="2.4" stroke-linecap="round"/>
          <ellipse cx="22" cy="30" rx="7" ry="3.4" fill="#A8C5AE" opacity=".55" transform="rotate(-38 22 30)"/>
          <ellipse cx="34" cy="18" rx="7" ry="3.4" fill="#A8C5AE" opacity=".4" transform="rotate(-46 34 18)"/>
          <circle cx="47" cy="9" r="4.6" fill="#D8B8D9"/>
          <circle cx="47" cy="9" r="2" fill="#F6EBDD"/>
        </svg>
        <svg class="card-sprig sprig-br" viewBox="0 0 60 60" aria-hidden="true" focusable="false">
          <path d="M54 6C50 26 38 42 16 52" fill="none" pathLength="1" stroke="#A8C5AE" stroke-width="2.4" stroke-linecap="round"/>
          <ellipse cx="38" cy="30" rx="7" ry="3.4" fill="#A8C5AE" opacity=".5" transform="rotate(-38 38 30)"/>
          <circle cx="14" cy="51" r="4.6" fill="#E9B8A9"/>
          <circle cx="14" cy="51" r="2" fill="#F6EBDD"/>
        </svg>
        <p class="card-eyebrow" data-cfg="card.eyebrow"></p>
        <h2 id="card-title" class="card-title" tabindex="-1" data-cfg="card.title"></h2>
        <p class="card-date">
          <svg class="icon-heart-sm" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 20.6s-6.2-4-8.6-7.5C1.7 10.5 2.8 7.2 5.8 6.8c1.8-.25 3.3.65 4.2 2 .9-1.35 2.4-2.25 4.2-2 3 .44 4.1 3.7 2.4 6.3C14.2 16.6 12 20.6 12 20.6Z" fill="currentColor"/></svg>
          <span data-cfg="birthDateLabel"></span>
        </p>
        <div class="card-divider" aria-hidden="true"><span></span><svg viewBox="0 0 24 24" focusable="false"><path d="M12 3l2 6.2L20.4 11l-6.4 1.8L12 19l-2-6.2L3.6 11 10 9.2 12 3Z" fill="currentColor"/></svg><span></span></div>
        <p class="card-message" data-cfg="card.message"></p>
        <div class="card-actions">
          <button id="btn-to-letter" class="btn btn-primary" data-cfg="card.toLetterButton"></button>
        </div>
      </article>
    </section>

    <!-- 4+5. LÁ THƯ & LỜI NHẮN NHỎ -->
    <section id="screen-letter" class="screen screen-letter" data-screen="letter">
      <div class="letter-wrap">

        <div class="env-stage" id="env-stage">
          <button id="envelope" class="envelope" aria-label="Mở phong bì">
            <span class="env-back" aria-hidden="true"></span>
            <span class="env-letter-peek" aria-hidden="true"><i class="peek-line"></i><i class="peek-line short"></i></span>
            <span class="env-pocket" aria-hidden="true"></span>
            <span class="env-flap" aria-hidden="true"></span>
            <span class="env-seal" aria-hidden="true">
              <svg viewBox="0 0 24 24" focusable="false"><path d="M12 20.6s-6.2-4-8.6-7.5C1.7 10.5 2.8 7.2 5.8 6.8c1.8-.25 3.3.65 4.2 2 .9-1.35 2.4-2.25 4.2-2 3 .44 4.1 3.7 2.4 6.3C14.2 16.6 12 20.6 12 20.6Z" fill="currentColor"/></svg>
            </span>
          </button>
          <p class="env-hint" data-cfg="letter.envelopeHint"></p>
        </div>

        <article class="letter-article" id="letter-article" hidden>
          <p class="letter-stamp" data-cfg="birthDateLabel"></p>
          <h2 id="letter-title" class="letter-title" tabindex="-1" data-cfg="letter.title"></h2>
          <div class="letter-body" id="letter-body"></div>
          <p class="letter-closing" data-cfg="letter.closing"></p>
          <p class="letter-sign">
            <span class="sign-label" data-cfg="letter.signatureLabel"></span>
            <span class="sign-name" data-cfg="senderName"></span>
          </p>
          <div class="letter-flourish" aria-hidden="true"><span></span><svg viewBox="0 0 24 24" focusable="false"><path d="M12 20.6s-6.2-4-8.6-7.5C1.7 10.5 2.8 7.2 5.8 6.8c1.8-.25 3.3.65 4.2 2 .9-1.35 2.4-2.25 4.2-2 3 .44 4.1 3.7 2.4 6.3C14.2 16.6 12 20.6 12 20.6Z" fill="currentColor"/></svg><span></span></div>
          <p class="letter-ps" id="letter-ps" hidden><span class="ps-label">P/S</span> <span id="letter-ps-text"></span></p>
        </article>

        <div class="notes-block" id="notes-block" hidden>
          <h3 class="notes-title" data-cfg="notes.sectionTitle"></h3>
          <p class="notes-hint" data-cfg="notes.sectionHint"></p>
          <div class="notes-row" id="notes-row"></div>
          <div class="notes-actions">
            <button id="btn-finish" class="btn btn-primary" data-cfg="notes.skipLabel"></button>
          </div>
        </div>

      </div>
    </section>

    <!-- 6. MÀN HÌNH KẾT THÚC -->
    <section id="screen-ending" class="screen screen-ending" data-screen="ending">
      <div class="ending-inner">
        <div class="flowers-wrap" aria-hidden="true">
          <svg class="flowers" viewBox="0 0 560 300" focusable="false">
            <defs>
              <radialGradient id="groundGlow" cx="50%" cy="50%" r="50%">
                <stop offset="0%" stop-color="rgba(85,70,63,0.15)"/>
                <stop offset="100%" stop-color="rgba(85,70,63,0)"/>
              </radialGradient>
            </defs>
            <ellipse cx="280" cy="274" rx="250" ry="24" fill="url(#groundGlow)"/>

            <g class="sway sway-a">
              <path d="M160 272 C152 220 172 180 158 132" fill="none" stroke="#A8C5AE" stroke-width="4" stroke-linecap="round"/>
              <ellipse cx="168" cy="212" rx="14" ry="6" fill="#A8C5AE" opacity=".65" transform="rotate(-24 168 212)"/>
              <ellipse cx="150" cy="176" rx="13" ry="5.5" fill="#A8C5AE" opacity=".5" transform="rotate(-14 150 176)"/>
              <g transform="translate(156 126)">
                <ellipse cx="0" cy="-11" rx="7.5" ry="11" fill="#E9B8A9"/>
                <ellipse cx="10.5" cy="-3.5" rx="7.5" ry="11" fill="#E9B8A9" transform="rotate(72 10.5 -3.5)"/>
                <ellipse cx="6.5" cy="9" rx="7.5" ry="11" fill="#E9B8A9" transform="rotate(144 6.5 9)"/>
                <ellipse cx="-6.5" cy="9" rx="7.5" ry="11" fill="#E9B8A9" transform="rotate(216 -6.5 9)"/>
                <ellipse cx="-10.5" cy="-3.5" rx="7.5" ry="11" fill="#E9B8A9" transform="rotate(288 -10.5 -3.5)"/>
                <circle cx="0" cy="0" r="5.5" fill="#F2D49B"/>
              </g>
            </g>

            <g class="sway sway-b">
              <path d="M280 274 C278 230 286 196 276 156" fill="none" stroke="#A8C5AE" stroke-width="4" stroke-linecap="round"/>
              <ellipse cx="292" cy="220" rx="14" ry="6" fill="#A8C5AE" opacity=".6" transform="rotate(-20 292 220)"/>
              <g transform="translate(274 148)">
                <ellipse cx="0" cy="-10" rx="7" ry="10.5" fill="#D8B8D9"/>
                <ellipse cx="9.5" cy="-3" rx="7" ry="10.5" fill="#D8B8D9" transform="rotate(72 9.5 -3)"/>
                <ellipse cx="6" cy="8.5" rx="7" ry="10.5" fill="#D8B8D9" transform="rotate(144 6 8.5)"/>
                <ellipse cx="-6" cy="8.5" rx="7" ry="10.5" fill="#D8B8D9" transform="rotate(216 -6 8.5)"/>
                <ellipse cx="-9.5" cy="-3" rx="7" ry="10.5" fill="#D8B8D9" transform="rotate(288 -9.5 -3)"/>
                <circle cx="0" cy="0" r="5" fill="#F6EBDD"/>
              </g>
            </g>

            <g class="sway sway-c">
              <path d="M398 272 C404 226 388 190 402 146" fill="none" stroke="#A8C5AE" stroke-width="4" stroke-linecap="round"/>
              <ellipse cx="390" cy="210" rx="13" ry="5.5" fill="#A8C5AE" opacity=".6" transform="rotate(18 390 210)"/>
              <g transform="translate(404 140)">
                <ellipse cx="0" cy="-9.5" rx="6.5" ry="10" fill="#A9BBD6"/>
                <ellipse cx="9" cy="-3" rx="6.5" ry="10" fill="#A9BBD6" transform="rotate(72 9 -3)"/>
                <ellipse cx="5.5" cy="8" rx="6.5" ry="10" fill="#A9BBD6" transform="rotate(144 5.5 8)"/>
                <ellipse cx="-5.5" cy="8" rx="6.5" ry="10" fill="#A9BBD6" transform="rotate(216 -5.5 8)"/>
                <ellipse cx="-9" cy="-3" rx="6.5" ry="10" fill="#A9BBD6" transform="rotate(288 -9 -3)"/>
                <circle cx="0" cy="0" r="5" fill="#F2D49B"/>
              </g>
            </g>

            <g class="sway sway-d">
              <path d="M92 274 C90 246 96 226 88 202" fill="none" stroke="#A8C5AE" stroke-width="3.4" stroke-linecap="round"/>
              <g transform="translate(86 194)">
                <circle cx="0" cy="0" r="7" fill="#F2D49B"/>
                <circle cx="0" cy="0" r="3" fill="#F6EBDD"/>
              </g>
            </g>

            <g class="sway sway-e">
              <path d="M470 274 C472 250 464 232 472 210" fill="none" stroke="#A8C5AE" stroke-width="3.4" stroke-linecap="round"/>
              <g transform="translate(474 202)">
                <circle cx="0" cy="0" r="6.5" fill="#E9B8A9"/>
                <circle cx="0" cy="0" r="2.8" fill="#F6EBDD"/>
              </g>
            </g>
          </svg>
        </div>
        <h2 class="ending-title" id="ending-title" tabindex="-1" data-cfg="ending.title"></h2>
        <p class="ending-message" data-cfg="ending.message"></p>
        <p class="ending-sign" data-cfg="ending.signature"></p>
        <p class="ending-invite" id="ending-invite" hidden></p>
        <div class="ending-actions">
          <button id="btn-replay" class="btn btn-ghost" data-cfg="ending.replayButton"></button>
          <button id="btn-end" class="btn btn-primary" data-cfg="ending.endButton"></button>
        </div>
      </div>
    </section>

    <!-- Màn hình tĩnh lặng sau "Kết thúc" -->
    <section id="screen-farewell" class="screen screen-farewell" data-screen="farewell">
      <div class="farewell-inner">
        <svg class="farewell-heart" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 20.6s-6.2-4-8.6-7.5C1.7 10.5 2.8 7.2 5.8 6.8c1.8-.25 3.3.65 4.2 2 .9-1.35 2.4-2.25 4.2-2 3 .44 4.1 3.7 2.4 6.3C14.2 16.6 12 20.6 12 20.6Z" fill="currentColor"/></svg>
        <h2 class="farewell-title" id="farewell-title" tabindex="-1" data-cfg="farewell.title"></h2>
        <p class="farewell-sub" id="farewell-sub" hidden></p>
        <p class="farewell-sign" data-cfg="ending.signature"></p>
        <button id="btn-replay-2" class="link-btn" data-cfg="farewell.replayHint"></button>
      </div>
    </section>

  </main>

  <!-- LỚP HIỆU ỨNG HẠT (lấp lánh) -->
  <canvas id="fx-canvas" aria-hidden="true"></canvas>

  <!-- THÔNG BÁO NGẮN -->
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <noscript>
    <div class="noscript-note">Món quà nhỏ này cần JavaScript để mở. Hãy bật JavaScript rồi tải lại trang nhé.</div>
  </noscript>

  <script src="config.js"></script>
  <script src="script.js"></script>
</body>
</html>
